<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100vh;
      padding: 20px;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background-color: #0f0f0f;
      color: #e5e5e5;
      display: flex;
      flex-direction: column;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }

    .header img {
      width: 28px;
      height: 28px;
      border-radius: 6px;
    }

    h2 {
      font-size: 18px;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: -0.3px;
    }

    .subtitle {
      font-size: 13px;
      color: #737373;
      margin-bottom: 20px;
    }

    .input-group {
      position: relative;
      margin-bottom: 12px;
    }

    textarea {
      width: 100%;
      height: 90px;
      padding: 12px 14px;
      border: 1px solid #262626;
      border-radius: 10px;
      background-color: #1a1a1a;
      color: #f5f5f5;
      resize: none;
      font-family: inherit;
      font-size: 13px;
      line-height: 1.5;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    textarea::placeholder {
      color: #525252;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-bottom: 0;
    }

    .btn-row button {
      flex: 1;
      padding: 11px 16px;
      border: none;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: all 0.2s ease;
    }

    #runBtn {
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: white;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
    }

    #runBtn:hover:not(:disabled) {
      background: linear-gradient(135deg, #1d4ed8, #2563eb);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
      transform: translateY(-1px);
    }

    #runBtn:disabled,
    #generateBtn:disabled {
      background: #262626;
      color: #525252;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    #generateBtn {
      background: linear-gradient(135deg, #059669, #10b981);
      color: white;
      box-shadow: 0 2px 8px rgba(5, 150, 105, 0.3);
    }

    #generateBtn:hover:not(:disabled) {
      background: linear-gradient(135deg, #047857, #059669);
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.4);
      transform: translateY(-1px);
    }

    #stopBtn {
      flex: 1;
      padding: 11px 16px;
      border: none;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      background: #1a1a1a;
      color: #ef4444;
      border: 1px solid #262626;
      display: none;
    }

    #stopBtn:hover {
      background: #262626;
      border-color: #ef4444;
    }

    /* ─── CODE BANNER (collapsible) ─── */
    .code-banner {
      display: none;
      flex-direction: column;
      background: #0a0a0a;
      border: 1px solid #1f4e3d;
      border-radius: 10px;
      margin-top: 8px;
      overflow: hidden;
      transition: all 0.2s ease;
    }

    .code-banner.visible {
      display: flex;
    }

    .code-banner-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: #0d2818;
      cursor: pointer;
      user-select: none;
    }

    .code-banner-header:hover {
      background: #113320;
    }

    .code-banner-title {
      font-size: 11px;
      font-weight: 600;
      color: #34d399;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .code-banner-actions {
      display: flex;
      gap: 6px;
    }

    .code-banner-actions button {
      padding: 4px 10px;
      font-size: 10px;
      border-radius: 5px;
      border: 1px solid #262626;
      background: #1a1a1a;
      color: #a3a3a3;
      cursor: pointer;
      font-weight: 500;
    }

    .code-banner-actions button:hover {
      background: #262626;
      color: #e5e5e5;
    }

    .code-banner-body {
      max-height: 300px;
      overflow-y: auto;
      padding: 10px 12px;
      transition: max-height 0.3s ease;
    }

    .code-banner-body.collapsed {
      max-height: 0;
      padding: 0 12px;
    }

    .code-banner-body pre {
      margin: 0;
      font-family: 'Cascadia Code', 'Fira Code', 'SF Mono', monospace;
      font-size: 11px;
      line-height: 1.5;
      color: #d4d4d4;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .code-banner-body::-webkit-scrollbar {
      width: 4px;
    }

    .code-banner-body::-webkit-scrollbar-thumb {
      background: #262626;
      border-radius: 4px;
    }

    .toggle-arrow {
      font-size: 10px;
      color: #737373;
      transition: transform 0.2s;
    }

    .toggle-arrow.collapsed {
      transform: rotate(-90deg);
    }

    /* ─── STEP GROUP RENDERING ─── */
    .step-group {
      margin-bottom: 6px;
      border-radius: 8px;
      background: #111111;
      border: 1px solid #1a1a1a;
      overflow: hidden;
      transition: border-color 0.15s ease;
    }

    .step-group:hover {
      border-color: #262626;
    }

    .step-group.current {
      border-color: #3b82f6;
      background: #0d1117;
    }

    .step-group.completed {
      background: #111111;
    }

    .step-group.failed {
      border-color: #f87171;
      background: #1a0a0a;
    }

    .step-summary {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s ease;
    }

    .step-summary::before {
      content: '>';
      font-size: 10px;
      color: #737373;
      transition: transform 0.2s;
      display: inline-block;
    }

    .step-group.expanded .step-summary::before {
      transform: rotate(90deg);
    }

    .step-summary:hover {
      background: #1a1a1a;
    }

    .step-group.current .step-summary {
      background: #0d1117;
    }

    .step-number {
      font-size: 11px;
      font-weight: 600;
      color: #60a5fa;
      min-width: 24px;
    }

    .step-action {
      font-size: 12px;
      color: #d4d4d4;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .step-status {
      font-size: 11px;
      font-weight: 600;
      min-width: 20px;
      text-align: right;
    }

    .status-pending { color: #737373; }
    .status-running { 
      color: #60a5fa; 
      animation: pulse 1.5s ease-in-out infinite;
    }
    .status-success { color: #22c55e; }
    .status-failed { color: #ef4444; }
    .status-warning { color: #f59e0b; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .step-details {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
      background: #0a0a0a;
      border-top: 1px solid transparent;
    }

    .step-group.expanded .step-details {
      max-height: 500px;
      border-top-color: #1a1a1a;
    }

    .step-details-inner {
      padding: 8px 12px;
      font-family: 'Cascadia Code', 'Fira Code', 'SF Mono', monospace;
      font-size: 11px;
      line-height: 1.6;
      color: #a3a3a3;
    }

    .step-details-inner .log-entry {
      margin-bottom: 2px;
      padding: 1px 0;
      line-height: 1.5;
    }

    .step-details-inner .log-step {
      color: #60a5fa;
      font-weight: 600;
    }

    .step-details-inner .log-decision {
      color: #34d399;
      font-weight: 500;
    }

    .step-details-inner .log-success {
      color: #22c55e;
    }

    .step-details-inner .log-error {
      color: #f87171;
    }

    .step-details-inner .log-info {
      color: #737373;
    }

    /* ─── COMPACT MODE TOGGLE ─── */
    .view-toggle {
      display: flex;
      gap: 4px;
      margin-bottom: 8px;
    }

    .view-toggle button {
      padding: 4px 10px;
      font-size: 10px;
      border-radius: 5px;
      border: 1px solid #262626;
      background: #1a1a1a;
      color: #a3a3a3;
      cursor: pointer;
      font-weight: 500;
    }

    .view-toggle button.active {
      background: #262626;
      color: #e5e5e5;
      border-color: #404040;
    }

    /* ─── STATUS BAR ─── */
    .status-bar {
      border-radius: 8px;
      border: 1px solid #262626;
      font-size: 11px;
      color: #737373;
      display: none;
    }

    .status-bar.active {
      display: flex;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.4;
      }
    }

    .logs-container {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      margin-top: 4px;
    }

    .logs-header {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #525252;
      margin-bottom: 8px;
    }

    #logs {
      flex-grow: 1;
      overflow-y: auto;
      background-color: #0a0a0a;
      border-radius: 10px;
      padding: 12px;
      font-family: 'Cascadia Code', 'Fira Code', 'SF Mono', monospace;
      font-size: 11px;
      line-height: 1.6;
      border: 1px solid #1a1a1a;
    }

    #logs::-webkit-scrollbar {
      width: 4px;
    }

    #logs::-webkit-scrollbar-track {
      background: transparent;
    }

    #logs::-webkit-scrollbar-thumb {
      background: #262626;
      border-radius: 4px;
    }

    .log-entry {
      margin-bottom: 4px;
      word-break: break-word;
      padding: 2px 0;
    }

    .log-step {
      color: #60a5fa;
      font-weight: 600;
    }

    .log-decision {
      color: #34d399;
    }

    .log-success {
      color: #22c55e;
    }

    .log-error {
      color: #f87171;
    }

    .log-info {
      color: #737373;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #404040;
      font-size: 12px;
      gap: 8px;
    }

    .empty-state-icon {
      font-size: 24px;
      opacity: 0.5;
    }
  </style>
</head>

<body>
  <div class="header">
    <h2>HyprFlow </h2>
  </div>
  <div class="subtitle">AI browser automation- directly in your browser</div>

  <div class="input-group">
    <textarea id="promptInput" placeholder="Describe what you want to automate on this page..."></textarea>
  </div>

  <div class="btn-row">
    <button id="runBtn">Run Agent</button>
    <button id="generateBtn" disabled> Generate Code</button>
  </div>
  <div class="btn-row" style="margin-top:6px">
    <button id="stopBtn">Stop</button>
  </div>
  
  <div class="btn-row" id="planApprovalContainer" style="display: none; margin-top: 6px;">
     <button id="approvePlanBtn" style="background: linear-gradient(135deg, #22c55e, #16a34a); color: white;">Approve Plan</button>
     <button id="rejectPlanBtn" style="background: #1a1a1a; color: #ef4444; border: 1px solid #262626;">Reject & Retry</button>
  </div>

  <div class="status-bar" id="statusBar">
    <div class="status-dot"></div>
    <span id="statusText">Agent is running...</span>
  </div>

  <!-- Collapsible generated code banner -->
  <div class="code-banner" id="codeBanner">
    <div class="code-banner-header" id="codeBannerHeader">
      <span class="code-banner-title">
         <span class="toggle-arrow" id="codeBannerArrow">[+]</span>
        Generated Selenium Code
      </span>
      <div class="code-banner-actions">
         <button id="copyCodeBtn">Copy</button>
      </div>
    </div>
    <div class="code-banner-body" id="codeBannerBody">
      <pre id="codeContent"></pre>
    </div>
  </div>

  <div class="logs-container">
    <div class="logs-header">
      <span style="flex:1">Execution Log</span>
      <div class="view-toggle">
        <button id="collapseAllBtn">Collapse All</button>
        <button id="expandAllBtn">Expand All</button>
      </div>
    </div>
    <div id="logs">
      <div class="empty-state">
        <!-- <div class="empty-state-icon">🤖</div> -->
        <div>Enter a task and click Run to start</div>
      </div>
    </div>
  </div>

  <script src="panel.js"></script>
</body>

</html>
